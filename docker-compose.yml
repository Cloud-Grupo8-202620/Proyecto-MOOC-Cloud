# Entorno compartido API/worker (Postgres, Redis, S3 y Pub/Sub).
x-common-env: &common-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: mydb
  POSTGRES_SSLMODE: "disable"
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ""
  S3_ENDPOINT: s3:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_USE_SSL: "false"
  S3_REGION: us-east-1
  S3_BUCKET_ORIGINALS: originals
  S3_BUCKET_HLS: hls
  S3_BUCKET_PUBLIC: public
  # Emulador local de Pub/Sub: sustituye a Redis/asynq para la mensajería.
  PUBSUB_EMULATOR_HOST: pubsub:8085
  PUBSUB_PROJECT_ID: mooc-local
  PUBSUB_TOPIC: media-jobs

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mydb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Almacenamiento de objetos S3-compatible (RustFS, ex-MinIO).
  # Formato de datos incompatible con MinIO: requiere volumen fresco.
  s3:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    platform: linux/amd64
    volumes:
      - clamav_data:/var/lib/clamav

  # El emulador reproduce topic, suscripción push, reintentos y ack. En GCP lo
  # sustituyen los recursos de Pub/Sub creados por Terraform.
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    platform: linux/amd64
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command: ["gcloud beta emulators pubsub start --host-port=0.0.0.0:8085"]
    environment:
      CLOUDSDK_CORE_PROJECT: mooc-local
      PATH: /google-cloud-sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  pubsub-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    platform: linux/amd64
    depends_on:
      - pubsub
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # El emulador expone REST además de gRPC; así no hace falta una cuenta
        # de gcloud para inicializarlo.
        for i in $$(seq 1 90); do
          curl -sf http://pubsub:8085/v1/projects/mooc-local/topics >/dev/null && break
          sleep 1
        done
        curl -sS -X PUT http://pubsub:8085/v1/projects/mooc-local/topics/media-jobs >/dev/null
        curl -sS -X PUT http://pubsub:8085/v1/projects/mooc-local/subscriptions/media-jobs-push \
          -H 'Content-Type: application/json' \
          -d '{"topic":"projects/mooc-local/topics/media-jobs","pushConfig":{"pushEndpoint":"http://worker:8080/pubsub/push"},"ackDeadlineSeconds":600}' \
          >/dev/null || true
        curl -sf http://pubsub:8085/v1/projects/mooc-local/subscriptions/media-jobs-push >/dev/null

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      s3:
        condition: service_started
      pubsub-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      <<: *common-env
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-prod}
      CDN_BASE_URL: ""
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    command: [ "./main" ]
  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
      clamav:
        condition: service_started
      pubsub-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *common-env
      CLAMAV_HOST: clamav:3310
      WORKER_MAX_ATTEMPTS: 5
      WORKER_TRANSCODE_TIMEOUT: 9m
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 12
    command: [ "./worker" ]
    # Escalamiento horizontal (stateless, idempotente): docker compose up --scale worker=2

volumes:
  postgres_data:
  redis_data:
  s3_data:
  clamav_data:
  mailpit_data:
